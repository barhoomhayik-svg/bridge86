<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- ── Viewport: viewport-fit=cover for iPhone notch/home indicator ── -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- ── PWA / theme ── -->
    <meta name="theme-color" content="#2563eb" />
    <meta name="application-name" content="Bridge" />
    <meta name="description" content="Dental lab ordering platform — connect doctors and labs seamlessly" />

    <!-- ── iOS PWA ── -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Bridge" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- ── iOS splash screens (optional, generated by vite-plugin-pwa in full setup) ── -->
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- ── Prevent iOS text size adjustment & zoom on focus ── -->
    <meta name="format-detection" content="telephone=no" />
    <meta name="apple-mobile-web-app-orientations" content="portrait" />

    <!-- ── Favicons ── -->
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />

    <!-- ── Manifest (injected by vite-plugin-pwa) ── -->

    <!-- ── OG / Twitter ── -->
    <meta property="og:title" content="Bridge" />
    <meta property="og:description" content="Dental lab ordering platform" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/icon-512.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:image" content="/icon-512.png" />

    <title>Bridge</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
